apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic-ingress
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Replace with the ACM certificate ARN from terraform output certificate_arn
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-central-1:569144120198:certificate/9a9373f8-af0b-4208-b78a-64385caa50e4"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Security groups: ALB SG only (enforced by VPC module)
    alb.ingress.kubernetes.io/security-groups: "sg-00b5c7599d0ea1da8"
    # Tags propagated to the ALB for cost tracking
    alb.ingress.kubernetes.io/tags: "Project=petclinic,Environment=dev,ManagedBy=kubernetes"
spec:
  ingressClassName: alb
  rules:
    - host: petclinic-dev.venkatesh-gangavarapu.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
